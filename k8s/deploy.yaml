apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-parser
  labels:
    app.kubernetes.io/name: pdf-parser
spec:
  # Kept at 1 because each run stores its output on the pod's local disk
  # (/app/web_runs) keyed by job id. A download could otherwise land on a
  # different replica than the one that produced it. To scale out, switch
  # web_runs to a shared ReadWriteMany volume (or add session affinity).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pdf-parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdf-parser
    spec:
      containers:
        - name: web
          image: ghcr.io/harkaibalazs/pdf-parser:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: WEB_CONCURRENCY
              value: "4"
            - name: GUNICORN_TIMEOUT
              value: "1200"
            # Upload ceiling. The proxy in front of this (the Gateway the
            # HTTPRoute attaches to) enforces its own request-body limit, so
            # raising this alone is not enough -- the two have to match, or the
            # proxy rejects the upload before it reaches the pod.
            - name: MAX_UPLOAD_MB
              value: "512"
            # Uncompressed size of a whole archive. Kept under the emptyDir
            # sizeLimit below, which also has to hold the extracted PDFs, the
            # parsed output, and the result zip.
            - name: MAX_TOTAL_MB
              value: "2048"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: "1"
              memory: 1Gi
              # Uploads and output are streamed to disk, not buffered in
              # memory, so it is ephemeral storage that a large batch exhausts.
              # Without a limit the pod can get evicted for filling the node.
              ephemeral-storage: 8Gi
          volumeMounts:
            - name: runs
              mountPath: /app/web_runs
      volumes:
        # Ephemeral scratch space for uploads + generated output. One run holds
        # the upload, the extracted PDFs, the parsed output and the result zip
        # at once, so size this well above MAX_UPLOAD_MB.
        - name: runs
          emptyDir:
            sizeLimit: 8Gi
